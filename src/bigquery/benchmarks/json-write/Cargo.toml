[package]
name    = "bigquery-json-write-benchmark"
version = "0.0.0"
publish = false
# Inherit other attributes from the workspace.
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace           = true
arrow                      = { workspace = true, features = ["ipc"] }
arrow-json.workspace       = true
bytes.workspace            = true
clap                       = { workspace = true, features = ["derive", "env", "help", "std"] }
google-cloud-bigquery      = { workspace = true, features = ["_internal-proto-write", "default-rustls-provider"] }
google-cloud-bigquery-v2   = { workspace = true, features = ["default"] }
google-cloud-wkt.workspace = true
prost.workspace            = true
prost-reflect.workspace    = true
prost-types.workspace      = true
rand.workspace             = true
serde.workspace            = true
serde_json                 = { workspace = true, features = ["raw_value", "std"] }
tokio                      = { workspace = true, features = ["full"] }
